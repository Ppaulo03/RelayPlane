# Builds the patched Evolution image (Baileys >= 7.0.0-rc12, CVE-2026-48063), scans it and only then publishes it to GHCR.
# Run manually (workflow_dispatch) or by pushing a tag `evolution-<version>`. The immutable digest to use in the compose file
# and Kubernetes manifests is printed in the job summary.
name: evolution-image

on:
  workflow_dispatch:
  push:
    tags: ["evolution-*"]
  # a release builds the same image through this workflow, so there is exactly one way to produce it
  workflow_call:
    outputs:
      image:
        description: Immutable reference of the published image (repository@sha256:...)
        value: ${{ jobs.image.outputs.image }}

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      TAG: 2.3.7-baileys-rc13
    outputs:
      image: ${{ steps.pin.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/relayplane-evolution" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # build locally first: nothing is published unless the scan passes
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/docker/evolution
          load: true
          tags: candidate:scan
      - name: the Baileys inside the image is the patched one
        run: |
          v=$(docker run --rm --entrypoint node candidate:scan -p "require('/evolution/node_modules/baileys/package.json').version")
          echo "baileys $v"
          [ "$v" = "7.0.0-rc13" ]
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: candidate:scan
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      # visibility, not a gate: the stock Evolution tree has many HIGH findings in its own dependencies (axios, brace-expansion...)
      # that this repository cannot fix without forking it; they are listed so they are never a surprise
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: candidate:scan
          severity: HIGH
          exit-code: "0"
          ignore-unfixed: true
          format: table
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/docker/evolution
          push: true
          tags: ${{ steps.name.outputs.image }}:${{ env.TAG }}
      - name: digest to pin
        id: pin
        run: |
          echo "image=${{ steps.name.outputs.image }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_OUTPUT"
          {
            echo "### Evolution image published"
            echo
            echo "Pin this immutable reference in docker-compose.yml and deploy/kubernetes/relayplane.yaml:"
            echo
            echo '```'
            echo "${{ steps.name.outputs.image }}@${{ steps.push.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
