# Release: builds gateway, worker, reconciler, simulator and the patched Evolution image, scans every one of them, and only when ALL of
# them passed publishes them to GHCR and renders the deployable artefacts, every image pinned by digest (docs/RELEASE.md).
#
# Two phases, so a release is published whole or not at all:
#   scan    one job per image: build ONCE, scan that build, keep it as an artefact. These jobs cannot write packages.
#   publish one job per image, started only if EVERY scan job succeeded: push the very bytes that were scanned and check the digest.
# (.github/actions/build-scan and .github/actions/publish; the architecture test fails if a workflow pushes any other way.)
#
# Run by pushing a tag `v<version>` (also creates the GitHub release with the artefacts) or manually (workflow_dispatch: the
# artefacts are only uploaded to the run; with `publish: false` it only builds and scans, which answers "can this commit be released?"
# without publishing anything). Third-party actions are pinned by commit SHA (internal/archtest/supply_chain_test.go).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version label to build (no leading v), e.g. 0.3.0-rc1
        required: true
      publish:
        description: "Publish the images (false: only build and scan every one of them, nothing is published)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          INPUT: ${{ inputs.version }}
        run: |
          v="${INPUT:-${GITHUB_REF_NAME#v}}"
          # the version ends up in image tags and a file name: allow nothing exotic
          echo "$v" | grep -Eq '^[0-9A-Za-z][0-9A-Za-z.+_-]{0,63}$' || { echo "bad version: $v" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

  # phase 1: nothing is published here, and this job has no permission to publish
  scan:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - {component: gateway, context: ., cmd: gateway}
          - {component: worker, context: ., cmd: worker}
          - {component: reconciler, context: ., cmd: reconciler}
          - {component: simulator, context: ., cmd: simulator}
          - {component: evolution, context: deploy/docker/evolution, report_high: "true"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # the patched Baileys is pinned in the Dockerfile, which also checks the FINAL dependency tree and fails the build otherwise
      - name: the Dockerfile pins the patched Baileys
        if: matrix.component == 'evolution'
        run: grep -Fq 'ARG BAILEYS_VERSION=7.0.0-rc13' deploy/docker/evolution/Dockerfile
      - uses: ./.github/actions/build-scan
        with:
          name: ${{ matrix.component }}
          context: ${{ matrix.context }}
          cmd: ${{ matrix.cmd }}
          version: ${{ needs.version.outputs.version }}
          report-high: ${{ matrix.report_high }}

  # phase 2: only when EVERY image of the release passed its scan (needs: scan waits for the whole matrix)
  publish:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
    needs: [version, scan]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        component: [gateway, worker, reconciler, simulator, evolution]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/relayplane-${{ matrix.component }}" >> "$GITHUB_OUTPUT"
      - id: push
        uses: ./.github/actions/publish
        with:
          name: ${{ matrix.component }}
          image: ${{ steps.name.outputs.image }}
          tag: ${{ needs.version.outputs.version }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: remember the digest
        run: echo "${{ steps.push.outputs.image }}" > "image-${{ matrix.component }}.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ matrix.component }}
          path: image-${{ matrix.component }}.txt

  manifests:
    needs: [version, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # only used to create the release when the run was started by a tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-*
          merge-multiple: true
          path: refs
      - name: render the artefacts (a placeholder or an unpinned image stops the release)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p dist
          gateway=$(cat refs/image-gateway.txt); worker=$(cat refs/image-worker.txt); reconciler=$(cat refs/image-reconciler.txt); simulator=$(cat refs/image-simulator.txt)
          EVOLUTION=$(cat refs/image-evolution.txt)
          go run ./cmd/render-release -in deploy/kubernetes/relayplane.yaml -out "dist/relayplane-$VERSION.yaml" \
            -gateway "$gateway" -worker "$worker" -reconciler "$reconciler" -evolution "$EVOLUTION"
          # the same references for the compose-based staging (deploy/staging/staging.sh up dist/images.env)
          {
            echo "GATEWAY_IMAGE=$gateway"
            echo "WORKER_IMAGE=$worker"
            echo "RECONCILER_IMAGE=$reconciler"
            echo "EVOLUTION_IMAGE=$EVOLUTION"
            # the provider simulator of the sandbox (never part of the Kubernetes manifest)
            echo "SIMULATOR_IMAGE=$simulator"
          } > dist/images.env
          # the sandbox without the repository: a script, its compose file and the images of this release
          mkdir -p "sandbox-$VERSION"
          cp deploy/sandbox/sandbox.sh deploy/sandbox/compose.yml dist/images.env "sandbox-$VERSION/"
          tar -czf "dist/relayplane-sandbox-$VERSION.tar.gz" "sandbox-$VERSION"
          {
            echo "### Release $VERSION"
            echo
            echo "Every image is immutable (pinned by digest):"
            echo
            echo '```'
            cat dist/images.env
            echo '```'
            echo
            echo "Artefacts: relayplane-$VERSION.yaml (Kubernetes), images.env (compose staging) and relayplane-sandbox-$VERSION.tar.gz (the sandbox, without the repository)."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ needs.version.outputs.version }}
          path: dist
      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            "dist/relayplane-$VERSION.yaml" dist/images.env "dist/relayplane-sandbox-$VERSION.tar.gz"

  # the released images, as published, must start together in the production configuration and pass the smoke test
  staging-smoke:
    needs: [version, manifests]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e sdk/python
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ needs.version.outputs.version }}
          path: dist
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: sh deploy/staging/staging.sh init
      - run: sh deploy/staging/staging.sh up dist/images.env
      - run: sh deploy/staging/staging.sh smoke
      - if: always()
        run: IMAGES_ENV=dist/images.env sh deploy/staging/staging.sh images
      - if: always()
        run: IMAGES_ENV=dist/images.env sh deploy/staging/staging.sh down -v
