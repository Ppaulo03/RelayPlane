# Release: builds gateway, worker, reconciler and the patched Evolution image, scans every one of them, publishes them to GHCR and
# renders the deployable artefacts, every image pinned by digest (docs/RELEASE.md). Nothing is published unless the scan passes.
#
# Run by pushing a tag `v<version>` (also creates the GitHub release with the artefacts) or manually (workflow_dispatch: the
# artefacts are only uploaded to the run). Third-party actions are pinned by commit SHA (internal/archtest/supply_chain_test.go).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version label to build (no leading v), e.g. 0.3.0-rc1
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          INPUT: ${{ inputs.version }}
        run: |
          v="${INPUT:-${GITHUB_REF_NAME#v}}"
          # the version ends up in image tags and a file name: allow nothing exotic
          echo "$v" | grep -Eq '^[0-9A-Za-z][0-9A-Za-z.+_-]{0,63}$' || { echo "bad version: $v" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

  evolution:
    uses: ./.github/workflows/evolution-image.yml
    permissions:
      contents: read
      packages: write

  images:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        component: [gateway, worker, reconciler]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/relayplane-${{ matrix.component }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # build locally first: nothing is published unless the scan passes
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: |
            CMD=${{ matrix.component }}
            VERSION=${{ needs.version.outputs.version }}
          load: true
          tags: candidate:scan
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: candidate:scan
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: |
            CMD=${{ matrix.component }}
            VERSION=${{ needs.version.outputs.version }}
          push: true
          tags: ${{ steps.name.outputs.image }}:${{ needs.version.outputs.version }}
          # build provenance and an SBOM travel with the image
          provenance: mode=max
          sbom: true
      - name: remember the digest
        run: echo "${{ steps.name.outputs.image }}@${{ steps.push.outputs.digest }}" > "image-${{ matrix.component }}.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ matrix.component }}
          path: image-${{ matrix.component }}.txt

  manifests:
    needs: [version, evolution, images]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # only used to create the release when the run was started by a tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-*
          merge-multiple: true
          path: refs
      - name: render the artefacts (a placeholder or an unpinned image stops the release)
        env:
          VERSION: ${{ needs.version.outputs.version }}
          EVOLUTION: ${{ needs.evolution.outputs.image }}
        run: |
          mkdir -p dist
          gateway=$(cat refs/image-gateway.txt); worker=$(cat refs/image-worker.txt); reconciler=$(cat refs/image-reconciler.txt)
          go run ./cmd/render-release -in deploy/kubernetes/relayplane.yaml -out "dist/relayplane-$VERSION.yaml" \
            -gateway "$gateway" -worker "$worker" -reconciler "$reconciler" -evolution "$EVOLUTION"
          # the same references for the compose-based staging (deploy/staging/staging.sh up dist/images.env)
          {
            echo "GATEWAY_IMAGE=$gateway"
            echo "WORKER_IMAGE=$worker"
            echo "RECONCILER_IMAGE=$reconciler"
            echo "EVOLUTION_IMAGE=$EVOLUTION"
          } > dist/images.env
          {
            echo "### Release $VERSION"
            echo
            echo "Every image is immutable (pinned by digest):"
            echo
            echo '```'
            cat dist/images.env
            echo '```'
            echo
            echo "Artefacts: relayplane-$VERSION.yaml (Kubernetes) and images.env (compose staging)."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ needs.version.outputs.version }}
          path: dist
      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            "dist/relayplane-$VERSION.yaml" dist/images.env

  # the released images, as published, must start together in the production configuration and pass the smoke test
  staging-smoke:
    needs: [version, manifests]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e sdk/python
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ needs.version.outputs.version }}
          path: dist
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: sh deploy/staging/staging.sh init
      - run: sh deploy/staging/staging.sh up dist/images.env
      - run: sh deploy/staging/staging.sh smoke
      - if: always()
        run: IMAGES_ENV=dist/images.env sh deploy/staging/staging.sh images
      - if: always()
        run: IMAGES_ENV=dist/images.env sh deploy/staging/staging.sh down -v
