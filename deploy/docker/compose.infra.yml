# Throw-away infrastructure for integration tests (non-default ports so it
# never collides with other local stacks). Images are pinned by digest.
name: relayplane-infra
services:
  postgres:
    image: postgres:17.5-alpine@sha256:6567bca8d7bc8c82c5922425a0baee57be8402df92bae5eacad5f01ae9544daa
    environment:
      POSTGRES_USER: relayplane
      POSTGRES_PASSWORD: relayplane
      POSTGRES_DB: relayplane_test
    ports: ["127.0.0.1:55440:5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relayplane -d relayplane_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4.4-alpine@sha256:ee9e8748ace004102a267f7b8265dab2c618317df22507b89d16a8add7154273
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:56390:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: relayplane
      MINIO_ROOT_PASSWORD: relayplane-secret
    ports: ["127.0.0.1:59010:9000"]
    tmpfs: [/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30
