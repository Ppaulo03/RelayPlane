groups:
  - name: relayplane
    rules:
      - alert: RelayPlaneOwnershipViolation
        expr: increase(relayplane_ownership_violation_total[5m]) > 0
        labels: {severity: page}
        annotations: {summary: "A webhook claimed a node that does not own the instance (possible split-brain)"}
      - alert: RelayPlaneEpochMismatch
        expr: increase(relayplane_assignment_epoch_mismatch_total[10m]) > 5
        labels: {severity: warn}
        annotations: {summary: "Repeated assignment epoch mismatches (stale owners/commands)"}
      - alert: RelayPlaneMigrationBlocked
        expr: increase(relayplane_migration_blocked_total[15m]) > 0
        labels: {severity: page}
        annotations: {summary: "A migration is blocked: the old owner could not be fenced"}
      - alert: RelayPlanePersistentDrift
        expr: increase(relayplane_reconciliation_drift_total[30m]) > 20
        labels: {severity: warn}
        annotations: {summary: "Desired and observed state keep diverging"}
      - alert: RelayPlaneReconciliationFailures
        expr: increase(relayplane_reconciliation_failure_total[10m]) > 5
        labels: {severity: warn}
        annotations: {summary: "Reconciliation passes are failing"}
      - alert: RelayPlaneWebhookBacklogOverflow
        expr: increase(relayplane_webhook_backlog_overflow_total[10m]) > 0
        for: 0m
        labels: {severity: page}
        annotations: {summary: "a tenant subscription reached its backlog limit and new events are being sent to its DLQ (WEBHOOK_MAX_PENDING_PER_SUBSCRIPTION): the consumer is down or too slow; redeliver from the DLQ when it is back"}
      - alert: RelayPlaneProjectionStalled
        expr: relayplane_event_projection_oldest_seconds > 60
        for: 1m
        labels: {severity: page}
        annotations: {summary: "delivery receipts or session state changes have waited over 60 s to be applied: no worker is projecting the event outbox. Nothing is lost, but messages stay ACCEPTED (and tenants are not told DELIVERED/READ) until a worker is back"}
      - alert: RelayPlaneTenantFanOutStalled
        expr: relayplane_event_outbox_oldest_seconds > 30
        for: 1m
        labels: {severity: page}
        annotations: {summary: "accepted events have waited over 30 s for their tenant deliveries to be created: no worker is fanning the event outbox out (workers down or the database unreachable). Nothing is lost, it is in the database, but tenants are told late"}
      - alert: RelayPlaneUnknownMessageWaiting
        expr: relayplane_unknown_oldest_seconds > 300
        for: 1m
        labels: {severity: page}
        annotations: {summary: "an UNKNOWN message has waited for a decision for over 5 minutes: it holds back the later messages of its instance (docs/runbooks/UNKNOWN-MESSAGES.md)"}
      - alert: RelayPlaneNodeUnhealthy
        expr: relayplane_provider_node_health == 0
        for: 2m
        labels: {severity: page}
        annotations: {summary: "Provider node {{ $labels.node }} is not READY; its instances are unavailable (no automatic failover)"}
      - alert: RelayPlaneQueueBacklog
        expr: relayplane_outbound_queue_depth > 1000
        for: 5m
        labels: {severity: warn}
        annotations: {summary: "Outbound command backlog is growing"}
      - alert: RelayPlaneDLQGrowth
        expr: increase(relayplane_outbound_dlq_total[15m]) > 0
        labels: {severity: warn}
        annotations: {summary: "Outbound commands are being dead-lettered"}
      - alert: RelayPlaneEventBusTrimRisk
        expr: relayplane_eventbus_trim_risk > 0.5
        for: 5m
        labels: {severity: warn}
        annotations: {summary: "A consumer group is {{ $value | humanizePercentage }} of the way to being overtaken by event-bus trimming"}
      - alert: RelayPlaneEventBusTrimRiskCritical
        expr: relayplane_eventbus_trim_risk > 0.9
        labels: {severity: page}
        annotations: {summary: "Event bus consumers are about to lose events (lag > 90% of EVENT_BUS_RETENTION): restore the consumer or raise the retention now"}
      - alert: RelayPlaneEventBusEventsLost
        expr: relayplane_eventbus_events_lost > 0
        labels: {severity: page}
        annotations: {summary: "Consumer group {{ $labels.group }} lost events to trimming; reconcile its state from the catalog"}
      - alert: RelayPlaneEventBusStuckEvents
        expr: relayplane_eventbus_oldest_pending_seconds > 300
        for: 5m
        labels: {severity: warn}
        annotations: {summary: "Group {{ $labels.group }} has an event unacknowledged for over 5 minutes"}
      - alert: RelayPlaneWebhookDeadLetters
        expr: relayplane_webhook_dead > 0
        for: 10m
        labels: {severity: warn}
        annotations: {summary: "{{ $value }} webhook deliveries are in the dead-letter queue: a tenant endpoint is failing (GET /subscriptions/{id}/deliveries?status=DEAD)"}
      - alert: RelayPlaneWebhookBacklog
        expr: relayplane_webhook_oldest_pending_seconds > 900
        for: 5m
        labels: {severity: warn}
        annotations: {summary: "Webhook deliveries have been waiting for over 15 minutes (endpoint down, circuit open, or workers behind)"}
      - alert: RelayPlaneWebhookCircuitOpen
        expr: relayplane_webhook_circuit_open > 0
        for: 10m
        labels: {severity: info}
        annotations: {summary: "A worker has an open circuit towards a tenant webhook endpoint for over 10 minutes"}
      - alert: RelayPlaneEventOutboxStalled
        expr: rate(relayplane_event_outbox_published_total[10m]) == 0 and on() increase(relayplane_outbound_messages_total{status="ACCEPTED"}[10m]) > 0
        for: 10m
        labels: {severity: page}
        annotations: {summary: "Outbound messages are being accepted but no tenant-facing events are published: the reconciler's event outbox is stuck"}
      - alert: RelayPlaneNoWorkers
        expr: absent(up{job="relayplane-worker"} == 1)
        for: 2m
        labels: {severity: page}
        annotations: {summary: "No worker is consuming outbound commands"}
